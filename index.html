<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Message pour toi, princesse.">
  <title>😊 Pour toi, princesse ❤️</title>
  <style>
    :root {
      --bg: #07070a;
      --red: #e3202f;
      --red-glow: rgba(227, 32, 47, 0.55);
      --white: #f6f4f2;
      --grey: #b9b6b3;
      --panel: rgba(10, 10, 14, 0.55);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--white);
      overflow: hidden;
    }

    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, rgba(227, 32, 47, 0.18), transparent 40%),
                  linear-gradient(180deg, rgba(7,7,10,0.25), rgba(7,7,10,0.75)),
                  #07070a;
    }

    .bg::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,7,10,0.1), rgba(7,7,10,0.7));
    }

    .stage {
      position: fixed; inset: 0;
      z-index: 2;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
    }

    .roll {
      position: absolute; left: 0; right: 0; top: 0;
      max-width: 680px; margin: 0 auto; padding: 30px 26px 140px;
      text-align: center;
      transform: translateY(100vh);
      animation: roll 110s linear 1 forwards;
      animation-play-state: paused;
    }

    .running .roll { animation-play-state: running; }
    .running.held .roll { animation-play-state: paused; }

    @keyframes roll {
      from { transform: translateY(100vh); }
      to { transform: translateY(-115%); }
    }

    .roll h2, .roll p, .roll div {
      margin: 0 0 28px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    .roll h2 {
      font-family: "Brush Script MT", "Segoe Print", cursive;
      font-size: clamp(2.2rem, 8vw, 4rem);
      color: var(--red);
      text-shadow: 0 0 22px var(--red-glow), 3px 3px 0 #000;
      margin-bottom: 36px;
      transform: rotate(-2deg);
    }

    .roll p {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      line-height: 1.7;
      font-weight: 500;
    }

    .roll p.accent {
      color: var(--red);
      font-weight: 700;
      text-shadow: 0 0 18px var(--red-glow), 0 2px 10px #000;
    }

    .roll .sign {
      font-family: "Brush Script MT", "Segoe Print", cursive;
      font-size: clamp(1.8rem, 7vw, 2.7rem);
      margin-top: 42px;
      white-space: pre-line;
      line-height: 1.4;
    }

    #intro {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center;
      background: rgba(7, 7, 10, 0.52);
      backdrop-filter: blur(6px);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
    }

    #intro h1 {
      font-family: "Brush Script MT", "Segoe Print", cursive;
      font-size: clamp(2.4rem, 10vw, 4.8rem);
      margin: 0;
      color: var(--red);
      text-shadow: 0 0 24px var(--red-glow), 3px 3px 0 #000;
      transform: rotate(-3deg);
    }

    #intro p {
      margin: 0;
      color: var(--grey);
      max-width: 360px;
      font-size: 1.05rem;
    }

    .enter {
      border: 2px solid var(--red);
      border-radius: 999px;
      background: var(--red);
      color: white;
      font-size: 1.08rem;
      font-weight: 700;
      padding: 14px 34px;
      cursor: pointer;
      box-shadow: 0 0 24px var(--red-glow);
      transition: transform 0.2s ease;
    }

    .enter:hover { transform: scale(1.04); }

    .sound {
      position: fixed; z-index: 30;
      top: 16px; right: 16px;
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--red);
      background: rgba(7,7,10,0.7);
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    .running ~ .sound, body.running .sound { display: block; }

    .hint {
      position: fixed; z-index: 6;
      left: 0; right: 0; bottom: 18px;
      text-align: center;
      font-size: 0.72rem; color: var(--grey);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .running .hint { opacity: 0.75; }

    .end {
      position: fixed; inset: 0; z-index: 10;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center;
    }

    .done .end { display: flex; animation: fade 1.2s ease; }

    .end p {
      margin: 0;
      font-family: "Brush Script MT", "Segoe Print", cursive;
      font-size: clamp(2rem, 8vw, 3.2rem);
      color: var(--red);
      text-shadow: 0 0 22px var(--red-glow), 3px 3px 0 #000;
      transform: rotate(-2deg);
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .roll {
        animation: none;
        transform: none;
        padding-top: 26vh;
      }
      .stage { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-label="Décor sombre pour un message romantique"></div>

  <div class="stage" id="stage" aria-live="off">
    <div class="roll" id="roll"></div>
  </div>

  <div class="hint">Maintiens ton doigt pour mettre en pause</div>

  <div id="intro">
    <h1>Pour toi</h1>
    <p>Un petit message sincère, de loin mais du fond du cœur.</p>
    <button class="enter" id="enter" type="button">Entrer 🎵</button>
  </div>

  <button class="sound" id="sound" type="button" aria-label="Couper ou remettre la musique">🔊</button>

  <div class="end" id="end">
    <p>Pour toi, princesse 💌</p>
    <button class="enter" id="replay" type="button">Revoir le message</button>
  </div>

  <audio id="music" preload="auto"></audio>

  <script>
    const $ = (id) => document.getElementById(id);
    const stage = $("stage");
    const roll = $("roll");
    const music = $("music");

    const LINES = [
      ["title", "À toi, ma princesse"],
      ["p", "Il y a des amitiés qui n'ont pas besoin de proximité pour exister."],
      ["p", "La nôtre en fait partie."],
      ["p", "Des kilomètres nous séparent, des frontières, des fuseaux horaires…"],
      ["accent", "Et pourtant, tu es là. Toujours."],
      ["p", "Merci d'être vraie avec moi, même quand ce n'est pas facile à entendre."],
      ["p", "Merci de m'écouter sans jamais me juger."],
      ["p", "Merci de me faire rire, même à travers un écran."],
      ["accent", "Une vraie amitié ne se mesure pas en distance, mais en présence dans le cœur."],
      ["p", "Quoi qu'il arrive, je serai là pour toi, comme tu l'as été pour moi."],
      ["p", "Un jour, on se retrouvera. D'ici là, chaque message compte."],
      ["p", "Princesse, même quand la distance pèse, sache que tu n'es jamais seule."],
      ["p", "Chaque fois que tu doutes, souviens-toi que quelqu'un, quelque part, croit en toi plus que tu ne le crois toi-même."],
      ["p", "Tu mérites tout le bonheur du monde, et je souhaite de tout cœur que la vie te le rende."],
      ["p", "Si un jour tout te semble trop lourd, pense à moi : je ne suis qu'un message de toi."],
      ["accent", "Tu es l'une des plus belles choses qui me soient arrivées."],
      ["accent", "Merci d'exister dans ma vie, princesse."],
      ["sign", "Avec toute ma sincérité,\nJacques ❤️"]
    ];

    LINES.forEach(([type, text]) => {
      const el = document.createElement(type === "title" ? "h2" : type === "sign" ? "div" : "p");
      el.textContent = text;
      el.className = type === "title" ? "title" : type === "sign" ? "sign" : type === "accent" ? "accent" : "";
      roll.appendChild(el);
    });

    const MUSIC_SRC = "";
    if (MUSIC_SRC) {
      music.src = MUSIC_SRC;
      music.volume = 0.7;
    }

    $("enter").addEventListener("click", () => {
      $("intro").classList.add("hide");
      document.body.classList.add("running");
      if (MUSIC_SRC) {
        music.play().catch(() => {});
      }
    });

    $("sound").addEventListener("click", () => {
      if (music.paused) {
        music.play().catch(() => {});
        $("sound").textContent = "🔊";
      } else {
        music.pause();
        $("sound").textContent = "🔇";
      }
    });

    function finish() {
      document.body.classList.add("done");
      $("sound").textContent = "🔇";
      if (!MUSIC_SRC) return;
      const iv = setInterval(() => {
        if (music.volume > 0.06) {
          music.volume = Math.max(0, music.volume - 0.05);
        } else {
          clearInterval(iv);
          music.pause();
          music.volume = 0.7;
        }
      }, 200);
    }

    roll.addEventListener("animationend", finish);

    stage.addEventListener("scroll", () => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches &&
          stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 4) {
        finish();
      }
    });

    $("replay").addEventListener("click", () => {
      document.body.classList.remove("done");
      roll.style.animation = "none";
      void roll.offsetWidth;
      roll.style.animation = "";
      if (MUSIC_SRC) {
        music.currentTime = 0;
        music.volume = 0.7;
        music.play().catch(() => {});
      }
      $("sound").textContent = "🔊";
    });

    const hold = (on) => document.body.classList.toggle("held", on);
    stage.addEventListener("pointerdown", () => hold(true));
    ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
      stage.addEventListener(eventName, () => hold(false));
    });
  </script>
</body>
</html>
